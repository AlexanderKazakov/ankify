name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install GStreamer (required by Azure Speech SDK for compressed audio)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      - name: Install dependencies
        run: uv sync --extra tts-edge --extra tts-aws --extra tts-azure --extra dev

      - name: Format
        run: uv run --no-sync ruff format --check src/

      - name: Lint
        run: uv run --no-sync ruff check src/

      - name: Tests without API keys
        if: github.ref != 'refs/heads/main'
        run: uv run --no-sync pytest

      - name: Tests with API keys
        if: github.ref == 'refs/heads/main'
        env:
          ANKIFY__PROVIDERS__AZURE__SUBSCRIPTION_KEY: ${{ secrets.ANKIFY__PROVIDERS__AZURE__SUBSCRIPTION_KEY }}
          ANKIFY__PROVIDERS__AWS__ACCESS_KEY_ID: ${{ secrets.ANKIFY__PROVIDERS__AWS__ACCESS_KEY_ID }}
          ANKIFY__PROVIDERS__AWS__SECRET_ACCESS_KEY: ${{ secrets.ANKIFY__PROVIDERS__AWS__SECRET_ACCESS_KEY }}
        run: uv run --no-sync pytest
