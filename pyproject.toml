[project]
name = "ankify"
version = "0.1.0"
description = "Arbitrary text to Anki deck with text-to-speech audio"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Core - always needed
    "genanki",
    "pydantic",
    "tenacity",
    "python-dotenv",
    "fastmcp>=3.0.0,<4",
]

[project.optional-dependencies]
# TTS providers
tts-azure = ["azure-cognitiveservices-speech"]
tts-aws = ["boto3"]
tts-edge = ["edge-tts"]
# AWS Lambda Web Adapter MCP Deployment
aws = ["ankify[tts-azure]","boto3","uvicorn"]
# Local MCP with free edge-tts
local-mcp = ["ankify[tts-edge]"]
# Development tools
dev = ["pytest", "pytest-asyncio", "pytest-mock", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pytest_asyncio]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/ankify"]
include = [
  "src/ankify/anki/templates/*.html",
  "src/ankify/anki/templates/*.css",
  "src/ankify/resources/*.json",
  "src/ankify/resources/skills",
  "src/ankify/resources/tts/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/ankify/anki/templates/*.html",
  "src/ankify/anki/templates/*.css",
  "src/ankify/resources/*.json",
  "src/ankify/resources/skills",
  "src/ankify/resources/tts/*.json",
]
