[project]
name = "ankify"
version = "0.1.0"
description = "Arbitrary text to Anki deck with text-to-speech audio"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core - always needed
    "genanki",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "python-dotenv",
    "jinja2",
    "fastmcp>=3.0.0,<4",
]

[project.optional-dependencies]
# CLI application (openai for LLM, pyyaml for config, rich for console)
cli = ["openai", "pyyaml", "rich"]
# TTS providers
tts-azure = ["azure-cognitiveservices-speech"]
tts-aws = ["boto3"]
tts-edge = ["edge-tts"]
# AWS Lambda Web Adapter MCP Deployment
aws = ["ankify[tts-azure]","boto3","uvicorn"]
# Local MCP with free edge-tts
local-mcp = ["ankify[tts-edge]"]
# Local CLI with free edge-tts
local-cli = ["ankify[cli,tts-edge]"]
# Full local: CLI application + Local MCP + all TTS providers
local-all = ["ankify[cli,tts-aws,tts-edge,tts-azure]"]
# Development tools
dev = ["pytest", "pytest-asyncio", "pytest-mock", "ruff"]
# LLM evaluation tools
eval = ["mlflow"]

[project.scripts]
ankify = "ankify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pytest_asyncio]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/ankify"]
include = [
  "src/ankify/anki/templates/*.html",
  "src/ankify/anki/templates/*.css",
  "src/ankify/resources/*.json",
  "src/ankify/resources/prompts/*.j2",
  "src/ankify/resources/prompts/language_specific/*.md",
  "src/ankify/resources/skills",
  "src/ankify/resources/tts/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/ankify/anki/templates/*.html",
  "src/ankify/anki/templates/*.css",
  "src/ankify/resources/*.json",
  "src/ankify/resources/prompts/*.j2",
  "src/ankify/resources/prompts/language_specific/*.md",
  "src/ankify/resources/skills",
  "src/ankify/resources/tts/*.json",
]
